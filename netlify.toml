[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- API routes (rewrites to functions) -------------------------------------
[[redirects]]
  from = "/api/shorten"
  to = "/.netlify/functions/shorten"
  status = 200

[[redirects]]
  from = "/api/links"
  to = "/.netlify/functions/links"
  status = 200

[[redirects]]
  from = "/api/links/*"
  to = "/.netlify/functions/links"
  status = 200

[[redirects]]
  from = "/api/info/*"
  to = "/.netlify/functions/info"
  status = 200

# --- SPA routes --------------------------------------------------------------
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# --- Short-link catch-all ----------------------------------------------------
# Non-forced, so real static files (/, /assets/*, favicon, ...) win first.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/redirect"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
