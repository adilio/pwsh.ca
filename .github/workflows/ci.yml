name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck + lint + vitest + production build. The suites here cover
      # the admin token check and the shortener's slug generation/validation,
      # so this gates the pieces the live site's /api surface depends on.
      - name: Verify
        run: npm run ci:verify
